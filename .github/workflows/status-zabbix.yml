name: "Status Page: Zabbix Event Processor"

on:
  repository_dispatch:
    types: [zabbix-alert]

jobs:
  process-zabbix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Zabbix Parser
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/status_engine/parse_zabbix.py

      - name: Commit & Push Changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -A status/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(status): update status for ${{ github.event.client_payload.host }}" && git push)
